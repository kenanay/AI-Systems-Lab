[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-systems-lab"
version = "1.2.0"
description = "Local-First AI Systems Research & Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kenan AY", email = ""},
]
maintainers = [
    {name = "Kenan AY", email = ""},
]
keywords = [
    "artificial-intelligence",
    "machine-learning",
    "deep-learning",
    "transformer",
    "pytorch",
    "llm",
    "nlp",
    "education",
    "research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "sentence-transformers>=2.6.0",
    "tokenizers>=0.15.0",
    "datasets>=2.16.0",
    "pandas>=2.1.4",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pylint>=3.0.3",
    "mypy>=1.7.1",
    "black>=23.12.1",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.2",
]

[project.urls]
Homepage = "https://github.com/kenanay/AI-Systems-Lab"
Documentation = "https://github.com/kenanay/AI-Systems-Lab/docs"
Repository = "https://github.com/kenanay/AI-Systems-Lab"
Issues = "https://github.com/kenanay/AI-Systems-Lab/issues"

[tool.setuptools]
packages = ["src", "backend"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "gpu: marks tests requiring GPU",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
]
